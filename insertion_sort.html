<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插入排序法範例</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background: linear-gradient(160deg, #fffbf2 0%, #f5f7ff 100%);
            color: #333;
        }
        h1, h2 {
            color: #117a8b;
        }
        p {
            margin: 10px 0;
        }
        nav a {
            display: inline-block;
            margin-bottom: 16px;
            background-color: #333;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .output, pre {
            background-color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 18px;
            border: 1px solid #dde4ed;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #117a8b;
        }
        .output {
            margin-top: 20px;
            min-height: 60px;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav style="margin-bottom: 20px;">
        <a href="index.html" style="color: #fff; text-decoration: none; padding: 8px 14px; background-color: #333; border-radius: 4px;">← 回到教學總覽</a>
    </nav>
    <h1>插入排序法</h1>
    <p>請輸入一組以逗號分隔的數字，然後按下排序按鈕來查看結果。</p>
    <input type="text" id="arrayInput" placeholder="例如：5,3,8,6,2">
    <button onclick="sortArray()">排序</button>
    <div class="output">
        <h2>排序結果：</h2>
        <p id="result"></p>
    </div>
    <script>
        // 插入排序函式
        function insertionSort(arr) {
            let n = arr.length;
            for (let i = 1; i < n; i++) {
                let key = arr[i];
                let j = i - 1;
                while (j >= 0 && arr[j] > key) {
                    arr[j + 1] = arr[j];
                    j = j - 1;
                }
                arr[j + 1] = key;
            }
            return arr;
        }

        // 排序按鈕的功能
        function sortArray() {
            const input = document.getElementById('arrayInput').value;
            const array = input.split(',').map(Number);
            const sortedArray = insertionSort(array);
            document.getElementById('result').textContent = sortedArray.join(', ');
        }
    </script>
</body>
</html>
