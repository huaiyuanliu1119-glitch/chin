<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sort Visualization</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #array { margin: 20px; }
        .bar { display: inline-block; width: 20px; margin-right: 2px; background-color: blue; }
    </style>
</head>
<body>
    <h1>Quick Sort Visualization</h1>
    <div id="array"></div>
    <button onclick="quickSort()">Sort Array</button>

    <script>
        let arr = [5, 3, 8, 6, 2, 7, 4, 1];
        const arrayDiv = document.getElementById('array');

        function displayArray(arr) {
            arrayDiv.innerHTML = '';
            arr.forEach(num => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${num * 30}px`;
                arrayDiv.appendChild(bar);
            });
        }

        async function quickSort(arr = arr, left = 0, right = arr.length - 1) {
            if (left < right) {
                let pivotIndex = await partition(arr, left, right);
                await Promise.all([
                    quickSort(arr, left, pivotIndex - 1),
                    quickSort(arr, pivotIndex + 1, right)
                ]);
            }
            displayArray(arr);
        }

        async function partition(arr, left, right) {
            let pivot = arr[right];
            let i = left - 1;
            for (let j = left; j < right; j++) {
                if (arr[j] < pivot) {
                    i++;
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                displayArray(arr);
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            [arr[i + 1], arr[right]] = [arr[right], arr[i + 1]];
            return i + 1;
        }

        displayArray(arr);
    </script>
</body>
</html>
